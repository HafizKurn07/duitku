<div class="fixed inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
  <div class="absolute -top-28 -left-24 w-80 h-80 rounded-full bg-brand/20 blur-3xl"></div>
  <div class="absolute top-1/3 -right-28 w-72 h-72 rounded-full bg-pop/15 blur-3xl"></div>
</div>

<noscript><p class="p-6 text-center font-semibold">Duitku membutuhkan JavaScript. Aktifkan JavaScript lalu muat ulang halaman.</p></noscript>

<div x-data="app" x-cloak @keydown.escape.window="closeTop()" class="relative mx-auto max-w-md min-h-screen pb-[calc(9rem+env(safe-area-inset-bottom))]">

  <!-- ===================== BERANDA ===================== -->
  <template x-if="tab==='home'">
  <main class="px-5 pt-[max(env(safe-area-inset-top),20px)] space-y-5">
    <header class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-2xl grid place-items-center font-extrabold text-white shrink-0" style="background:linear-gradient(135deg,#7C5CFF,#FF5FA2)" aria-hidden="true" x-text="initial"></div>
      <div class="min-w-0 flex-1">
        <p class="text-xs font-medium opacity-60" x-text="greeting"></p>
        <h1 class="text-xl font-extrabold leading-6 truncate" x-text="state.name"></h1>
      </div>
      <button class="iconbtn" @click="go('settings')" aria-label="Pengaturan"><svg class="ic"><use href="#i-settings"/></svg></button>
    </header>

    <!-- Kartu saldo -->
    <section class="hero rounded-4xl p-5 text-white relative overflow-hidden shadow-float" aria-label="Ringkasan saldo">
      <div class="absolute -right-12 -top-14 w-52 h-52 rounded-full bg-white/10"></div>
      <div class="absolute right-10 -bottom-16 w-40 h-40 rounded-full bg-lime/30"></div>
      <div class="relative">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-1.5">
            <p class="text-sm font-semibold text-white/85">Total saldo</p>
            <button @click="toggleHide()" class="w-8 h-8 rounded-full grid place-items-center text-white/85 active:bg-white/20" :aria-label="state.hideBalance?'Tampilkan saldo':'Sembunyikan saldo'"><svg class="ic !w-[18px] !h-[18px]"><use :href="state.hideBalance?'#i-eye-off':'#i-eye'"/></svg></button>
          </div>
          <div class="monthpill glass">
            <button @click="shift(-1)" aria-label="Bulan sebelumnya"><svg class="ic !w-4 !h-4"><use href="#i-chevron-left"/></svg></button>
            <span x-text="monthLabel"></span>
            <button @click="shift(1)" aria-label="Bulan berikutnya"><svg class="ic !w-4 !h-4"><use href="#i-chevron-right"/></svg></button>
          </div>
        </div>
        <p class="text-[34px] leading-[44px] font-extrabold tracking-tight num mt-1 truncate" x-text="hide(rp(totalBalance))"></p>
        <div class="grid grid-cols-2 gap-3 mt-5">
          <div class="rounded-2xl bg-white/15 backdrop-blur px-3.5 py-3 min-w-0">
            <div class="flex items-center gap-1.5 text-xs font-semibold text-white/85"><span class="w-5 h-5 rounded-full bg-white/25 grid place-items-center"><svg class="ic !w-3 !h-3"><use href="#i-arrow-down-left"/></svg></span>Masuk</div>
            <p class="font-bold num text-[15px] mt-1 truncate" x-text="rp(mStats.income)"></p>
          </div>
          <div class="rounded-2xl bg-white/15 backdrop-blur px-3.5 py-3 min-w-0">
            <div class="flex items-center gap-1.5 text-xs font-semibold text-white/85"><span class="w-5 h-5 rounded-full bg-white/25 grid place-items-center"><svg class="ic !w-3 !h-3"><use href="#i-arrow-up-right"/></svg></span>Keluar</div>
            <p class="font-bold num text-[15px] mt-1 truncate" x-text="rp(mStats.expense)"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- Sisa bulan ini -->
    <section class="card p-5 flex items-center gap-5" aria-label="Sisa bulan ini">
      <div class="w-[88px] h-[88px] shrink-0 rounded-full grid place-items-center" :style="ringStyle(mStats.rate)">
        <div class="w-[68px] h-[68px] rounded-full bg-white dark:bg-panel grid place-items-center text-center">
          <div><p class="text-base font-extrabold num leading-5" x-text="rateText(mStats.rate)"></p><p class="text-[10px] opacity-60 leading-3">tersisa</p></div>
        </div>
      </div>
      <div class="min-w-0 flex-1">
        <p class="label">Sisa bulan ini</p>
        <p class="text-xl font-extrabold num truncate" :class="mStats.net<0?'t-exp':''" x-text="hide(rp(mStats.net))"></p>
        <p class="text-xs mt-1 opacity-70" x-text="rateMsg"></p>
      </div>
    </section>

    <!-- Peringatan anggaran -->
    <template x-for="b in budgetRows.filter(b=>b.pct>=80)" :key="b.cat.id">
      <div class="rounded-2xl px-4 py-3 text-sm font-semibold flex items-center gap-3" role="status"
           :class="b.pct>=100 ? 'bg-red-100 text-red-700 dark:bg-red-500/20 dark:text-red-300' : 'bg-amber-100 text-amber-800 dark:bg-amber-500/20 dark:text-amber-300'">
        <svg class="ic"><use href="#i-triangle-alert"/></svg>
        <span x-text="b.pct>=100 ? `Anggaran ${b.cat.name} sudah lewat batas.` : `Anggaran ${b.cat.name} terpakai ${Math.round(b.pct)}%.`"></span>
      </div>
    </template>

    <!-- Target -->
    <section x-show="state.targets.length>0" aria-label="Target tabungan">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold">Target tabungan</h2>
        <button class="text-xs font-bold text-brand-deep dark:text-[#B7A8FF]" @click="go('targets')">Lihat semua</button>
      </div>
      <div class="flex gap-3 overflow-x-auto no-scrollbar -mx-5 px-5 snap-x snap-mandatory">
        <template x-for="t in state.targets" :key="t.id">
          <button class="card snap-start shrink-0 w-[172px] p-4 text-left" @click="go('targets'); openDetail(t)">
            <div class="flex items-center justify-between"><span class="text-2xl leading-none" x-text="t.emoji"></span><b class="text-xs num" x-text="Math.round(targetPct(t))+'%'"></b></div>
            <p class="font-bold text-sm mt-3 truncate" x-text="t.name"></p>
            <p class="text-[11px] opacity-60 num mt-0.5 truncate" x-text="hide(rp(targetSaved(t)))"></p>
            <div class="bar mt-3"><div :style="`width:${targetPct(t)}%;background:${t.color}`"></div></div>
          </button>
        </template>
      </div>
    </section>

    <!-- Kategori -->
    <section class="card p-5" aria-label="Pengeluaran per kategori">
      <h2 class="font-bold mb-4">Pengeluaran per kategori</h2>
      <p x-show="catStats.length===0" class="text-sm opacity-60 py-4 text-center">Belum ada pengeluaran bulan ini.</p>
      <div x-show="catStats.length>0" class="flex items-center gap-5">
        <div class="w-32 h-32 rounded-full shrink-0 grid place-items-center" :style="`background:${donut}`">
          <div class="w-[84px] h-[84px] rounded-full bg-white dark:bg-panel grid place-items-center text-center">
            <div><p class="text-[10px] opacity-60 leading-3">Total</p><p class="text-xs font-extrabold leading-4 num" x-text="compact(mStats.expense)"></p></div>
          </div>
        </div>
        <ul class="flex-1 space-y-2.5 min-w-0">
          <template x-for="c in catStats.slice(0,5)" :key="c.cat.id">
            <li class="flex items-center gap-2 text-xs">
              <span class="w-2.5 h-2.5 rounded-full shrink-0" :style="`background:${c.cat.color}`"></span>
              <span class="truncate flex-1" x-text="c.cat.emoji+' '+c.cat.name"></span>
              <b class="num" x-text="Math.round(c.pct)+'%'"></b>
            </li>
          </template>
        </ul>
      </div>
    </section>

    <!-- Tren 7 hari -->
    <section class="card p-5" aria-label="Pengeluaran 7 hari">
      <h2 class="font-bold mb-4">Pengeluaran 7 hari</h2>
      <div class="grid grid-cols-7 gap-2">
        <template x-for="d in trend" :key="d.key">
          <div class="flex flex-col items-center gap-1.5">
            <span class="text-[9px] opacity-60 h-3 leading-3 num" x-text="d.total? compact(d.total):''"></span>

  <!-- ===================== TRANSAKSI ===================== -->

        <button @click="shift(-1)" aria-label="Bulan sebelumnya"><svg class="ic !w-4 !h-4"><use href="#i-chevron-left"/></svg></button>

      </div>
    </header>

      <svg class="ic !w-4 !h-4 absolute left-4 top-1/2 -translate-y-1/2 opacity-40 pointer-events-none"><use href="#i-search"/></svg>

    <div class="flex gap-2 overflow-x-auto no-scrollbar">

      <div class="card px-4 py-3 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full c-exp"></span><span class="opacity-60">Keluar</span><b class="num ml-auto" x-text="compact(filteredTotals.exp)"></b></div>

          <template x-for="t in g.items" :key="t.id">
            <button type="button" @click="t.isTransferFee?null:openEdit(t)" class="card w-full flex items-center gap-3 p-3 text-left active:scale-[.985] transition-transform">
              <span class="w-11 h-11 rounded-2xl grid place-items-center text-xl shrink-0" :style="t.type==='transfer'?'background:#8B7CFF20':`background:${catOf(t.categoryId).color}2E`" x-text="t.type==='transfer'?'↔':catOf(t.categoryId).emoji"></span>
              <span class="flex-1 min-w-0">
                <span class="block font-bold text-sm truncate" x-text="t.note || (t.type==='transfer'?'Transfer':catOf(t.categoryId).name)"></span>
                <span class="block text-[11px] opacity-60 truncate" x-text="t.type==='transfer' ? walletOf(t.walletId).name+' → '+walletOf(t.toWalletId).name+(t.feeAmount?' · biaya '+rp(t.feeAmount):'') : catOf(t.categoryId).name+' · '+walletOf(t.walletId).name"></span>
              </span>
              <span class="font-extrabold text-sm num shrink-0" :class="t.type==='income'?'t-inc':t.type==='transfer'?'opacity-70':''" x-text="t.type==='transfer'?rp(t.amount):(t.type==='income'?'+':'-')+rp(t.amount)"></span>

    <div x-show="grouped.length===0" class="card p-6 text-center">
      <div class="w-12 h-12 mx-auto rounded-2xl bg-brand/10 text-brand-deep dark:text-[#B7A8FF] grid place-items-center mb-3"><svg class="ic"><use href="#i-search"/></svg></div>

  <!-- ===================== TARGET ===================== -->
  <template x-if="tab==='targets'">
  <main class="px-5 pt-[max(env(safe-area-inset-top),20px)] space-y-5">
    <header class="flex items-center justify-between gap-3 h-11">
      <h1 class="text-[22px] font-extrabold">Target tabungan</h1>
      <button @click="openTargetForm()" class="iconbtn !bg-brand !text-white" aria-label="Tambah target"><svg class="ic"><use href="#i-plus"/></svg></button>
    </header>

    <section class="rounded-4xl p-6 bg-lime text-ink relative overflow-hidden" aria-label="Total tabungan">
      <div class="absolute -right-10 -top-10 w-40 h-40 rounded-full bg-white/35"></div>
      <div class="relative">
        <p class="text-xs font-bold opacity-70">Total tertabung</p>
        <p class="text-[30px] leading-9 font-extrabold mt-1 num truncate" x-text="hide(rp(totalSaved))"></p>
        <p class="text-xs font-medium opacity-70 mt-1">dari total target <b class="num" x-text="rp(totalTarget)"></b></p>
        <div class="h-2 rounded-full bg-ink/10 mt-4 overflow-hidden"><div class="h-full rounded-full bg-ink transition-all" :style="`width:${totalTarget? Math.min(100,totalSaved/totalTarget*100):0}%`"></div></div>
      </div>
    </section>

    <div x-show="state.targets.length===0" class="card p-6 text-center">
      <div class="w-12 h-12 mx-auto rounded-2xl bg-brand/10 text-brand-deep dark:text-[#B7A8FF] grid place-items-center mb-3"><svg class="ic"><use href="#i-piggy-bank"/></svg></div>
      <p class="font-bold text-sm">Belum ada target</p>
      <p class="text-xs opacity-60 mt-1 mb-4">Mulai dari dana darurat, liburan, atau dana pernikahan.</p>
      <button class="btn btn-primary" @click="openTargetForm()">Buat target pertama</button>
    </div>

    <template x-for="t in state.targets" :key="t.id">
      <article class="card p-4">
        <button type="button" class="w-full flex items-center gap-4 text-left" @click="openDetail(t)">
          <span class="w-16 h-16 rounded-full shrink-0 grid place-items-center" :style="ring(t)">

          </span>
          <span class="flex-1 min-w-0">
            <span class="block font-bold truncate" x-text="t.name"></span>
            <span class="block text-xs mt-0.5 num opacity-70 truncate"><span x-text="hide(rp(targetSaved(t)))"></span> dari <span x-text="rp(t.target)"></span></span>
            <span class="block text-[11px] mt-1 font-semibold" :class="daysLeft(t)!==null && daysLeft(t)<0 && targetPct(t)<100 ? 't-exp' : 'opacity-60'" x-text="deadlineText(t)"></span>
          </span>

        </button>

        <div class="flex items-center justify-between gap-3 mt-4">

        </div>
      </article>
    </template>
  </main>
  </template>

  <!-- ===================== ANALISIS ===================== -->
  <template x-if="tab==='report'">

        <button @click="shift(1)" aria-label="Bulan berikutnya"><svg class="ic !w-4 !h-4"><use href="#i-chevron-right"/></svg></button>
      </div>
      <div class="monthpill" x-show="repMode==='year'">
        <button @click="shiftYear(-1)" aria-label="Tahun sebelumnya"><svg class="ic !w-4 !h-4"><use href="#i-chevron-left"/></svg></button>

      <button role="tab" :aria-selected="repMode==='day'" :class="repMode==='day'?'on':''" @click="repMode='day'">Harian</button>
      <button role="tab" :aria-selected="repMode==='week'" :class="repMode==='week'?'on':''" @click="repMode='week'">Mingguan</button>
      <button role="tab" :aria-selected="repMode==='month'" :class="repMode==='month'?'on':''" @click="repMode='month'">Bulanan</button>
      <button role="tab" :aria-selected="repMode==='year'" :class="repMode==='year'?'on':''" @click="repMode='year'">Tahunan</button>
    </div>

    <template x-if="repMode==='day'||repMode==='week'">
    <section class="card p-4 space-y-4" aria-label="Filter periode laporan">
      <div class="flex items-center justify-between gap-2">
        <button class="iconbtn !w-9 !h-9" @click="shiftReportDate(-1)" aria-label="Periode sebelumnya"><svg class="ic"><use href="#i-chevron-left"/></svg></button>
        <p class="text-sm font-bold text-center" x-text="reportRangeLabel"></p>
        <button class="iconbtn !w-9 !h-9" @click="shiftReportDate(1)" aria-label="Periode berikutnya"><svg class="ic"><use href="#i-chevron-right"/></svg></button>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div><p class="label">Pemasukan</p><p class="text-base font-extrabold num mt-1" x-text="rp(rangeStats.income)"></p></div>
        <div><p class="label">Pengeluaran</p><p class="text-base font-extrabold num mt-1" x-text="rp(rangeStats.expense)"></p></div>
        <div><p class="label">Selisih</p><p class="text-base font-extrabold num mt-1" :class="rangeStats.net<0?'t-exp':''" x-text="rp(rangeStats.net)"></p></div>

      </div>
      <p class="text-xs opacity-60" x-show="rangeStats.transfer">Transfer antardompet: <b class="num" x-text="rp(rangeStats.transfer)"></b> · tidak dihitung sebagai pemasukan/pengeluaran.</p>
      <div x-show="rangeDays.length" class="space-y-2">
        <template x-for="day in rangeDays" :key="day.date">
          <div class="grid grid-cols-[54px_1fr_auto] items-center gap-2 text-[11px]">
            <span class="opacity-60" x-text="dateShort(day.date)"></span>
            <div class="flex h-2 overflow-hidden rounded-full bg-black/5 dark:bg-white/10">
              <span class="h-full bg-lime-500" :style="`width:${rangeBarWidth(day.income)}%`"></span>
              <span class="h-full bg-pop" :style="`width:${rangeBarWidth(day.expense)}%`"></span>
            </div>
            <span class="num font-semibold" x-text="rp(day.income-day.expense)"></span>
          </div>
        </template>
      </div>

        </div>
        <div class="card p-4 min-w-0">
          <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-ink dark:bg-white"></span><span class="label">Selisih</span></div>
          <p class="text-[17px] font-extrabold num mt-2 truncate" :class="mStats.net<0?'t-exp':''" x-text="rp(mStats.net)"></p>
          <p class="text-[11px] font-semibold mt-1 flex items-center gap-1" :class="deltas.net.cls"><svg x-show="deltas.net.icon" class="ic !w-3.5 !h-3.5"><use :href="'#i-'+deltas.net.icon"/></svg><span x-text="deltas.net.text"></span></p>
        </div>
        <div class="card p-4 min-w-0">
          <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full c-sav"></span><span class="label">Ditabung ke target</span></div>
          <p class="text-[17px] font-extrabold num mt-2 truncate" x-text="rp(mStats.saved)"></p>
          <p class="text-[11px] font-semibold mt-1 flex items-center gap-1" :class="deltas.saved.cls"><svg x-show="deltas.saved.icon" class="ic !w-3.5 !h-3.5"><use :href="'#i-'+deltas.saved.icon"/></svg><span x-text="deltas.saved.text"></span></p>

      <section class="card p-5 flex items-center gap-5" aria-label="Rasio tabung">

          <div>
            <label class="label" for="inp-to-wallet">Dompet tujuan</label>
            <select id="inp-to-wallet" x-model="form.toWalletId" class="field field-on-card mt-2">
              <template x-for="w in state.wallets.filter(item=>item.id!==form.walletId)" :key="w.id"><option :value="w.id" x-text="walletName(w)"></option></template>
            </select>
          </div>
          <div>
            <label class="label" for="inp-fee">Biaya admin (opsional)</label>
            <input id="inp-fee" x-model="form.feeAmount" @input="form.feeAmount=fmtInput($event.target.value)" inputmode="numeric" placeholder="0" class="field field-on-card mt-2">
          </div>
        </div>
        <div class="flex gap-2 mb-3">
          <button type="button" class="chip" :class="form.date===todayStr?'on':''" @click="setDate('today')">Hari ini</button>
          <button type="button" class="chip" :class="form.date===yesterdayStr?'on':''" @click="setDate('yesterday')">Kemarin</button>
        </div>
        <input x-model="form.note" maxlength="120" placeholder="Catatan (opsional)" aria-label="Catatan" class="field field-on-card mb-2">
        <p x-show="formError" class="text-xs font-semibold t-exp mt-2" role="alert" x-text="formError"></p>
      </div>
      <div class="flex gap-2 p-5 pb-[max(env(safe-area-inset-bottom),20px)]">
        <button x-show="form.id" @click="removeTx()" class="btn btn-danger px-6" aria-label="Hapus transaksi"><svg class="ic"><use href="#i-trash-2"/></svg></button>
        <button @click="saveTx()" class="btn btn-primary flex-1" x-text="form.id?'Simpan perubahan':'Simpan'"></button>
      </div>
    </div>
  </div>

  <!-- ===================== LEMBAR: DETAIL TARGET ===================== -->
  <div x-show="detailId" class="fade fixed inset-0 z-40 flex items-end justify-center bg-black/50" @click.self="detailId=null" role="dialog" aria-modal="true" aria-label="Detail target">
    <template x-if="detailT">
      <div class="sheet w-full max-w-md bg-canvas dark:bg-night rounded-t-4xl max-h-[92dvh] flex flex-col">
        <div class="pt-3 pb-4 px-5"><div class="w-10 h-1.5 rounded-full bg-black/10 dark:bg-white/20 mx-auto"></div></div>
        <div class="px-5 overflow-y-auto no-scrollbar flex-1 space-y-4">
          <div class="flex items-center gap-4">
            <div class="w-[72px] h-[72px] rounded-full shrink-0 grid place-items-center" :style="ring(detailT)">
              <div class="w-[58px] h-[58px] rounded-full bg-canvas dark:bg-night grid place-items-center text-3xl" x-text="detailT.emoji"></div>
            </div>
            <div class="flex-1 min-w-0">
              <h2 class="text-lg font-extrabold truncate" x-text="detailT.name"></h2>
              <p class="text-xs opacity-60 mt-0.5" x-text="deadlineText(detailT)"></p>
            </div>
            <button @click="openTargetForm(detailT)" class="iconbtn" aria-label="Edit target"><svg class="ic"><use href="#i-pencil"/></svg></button>
          </div>
          <div class="card p-5">
            <div class="flex items-end justify-between">
              <div><p class="label">Terkumpul</p><p class="text-2xl font-extrabold num" x-text="hide(rp(targetSaved(detailT)))"></p></div>
              <b class="text-lg num" x-text="Math.round(targetPct(detailT))+'%'"></b>
            </div>
            <div class="bar mt-3"><div :style="`width:${targetPct(detailT)}%;background:${detailT.color}`"></div></div>
            <div class="grid grid-cols-2 gap-3 mt-4 text-xs">
              <div><p class="opacity-60">Target</p><p class="font-bold num mt-0.5" x-text="rp(detailT.target)"></p></div>
              <div><p class="opacity-60">Sisa</p><p class="font-bold num mt-0.5" x-text="rp(Math.max(0,detailT.target-targetSaved(detailT)))"></p></div>
            </div>
            <p class="text-xs font-semibold text-brand-deep dark:text-[#B7A8FF] mt-4" x-text="needText(detailT)"></p>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <button @click="openContrib(detailT,'in')" class="btn btn-lime">Setor</button>
            <button @click="openContrib(detailT,'out')" class="btn btn-soft">Tarik dana</button>
          </div>
          <div class="card p-5">
            <h3 class="font-bold mb-3">Riwayat</h3>
            <p x-show="detailT.contribs.length===0" class="text-xs opacity-60 text-center py-3">Belum ada setoran.</p>
            <ul class="space-y-3">
              <template x-for="c in sortedContribs(detailT)" :key="c.id">
                <li class="flex items-center gap-3 text-sm">
                  <span class="w-9 h-9 rounded-xl grid place-items-center shrink-0" :class="c.type==='in'?'bg-lime text-ink':'bg-pop/20 text-pop'"><svg class="ic !w-4 !h-4"><use :href="c.type==='in'?'#i-arrow-down-left':'#i-arrow-up-right'"/></svg></span>
                  <div class="flex-1 min-w-0">
                    <p class="font-semibold truncate" x-text="c.note || (c.type==='in'?'Setoran':'Penarikan')"></p>
                    <p class="text-[11px] opacity-60 truncate" x-text="dateShort(c.date)+' · '+(c.walletId? walletOf(c.walletId).name : 'Di luar dompet')"></p>
                  </div>
                  <b class="num text-xs" :class="c.type==='in'?'t-inc':''" x-text="(c.type==='in'?'+':'-')+rp(c.amount)"></b>
                  <button @click="delContrib(detailT,c)" class="w-8 h-8 grid place-items-center opacity-50 hover:opacity-100" aria-label="Hapus catatan"><svg class="ic !w-3.5 !h-3.5"><use href="#i-x"/></svg></button>
                </li>
              </template>
            </ul>
          </div>
        </div>
        <div class="p-5 pb-[max(env(safe-area-inset-bottom),20px)]"><button @click="detailId=null" class="btn btn-soft w-full">Tutup</button></div>
      </div>
    </template>
  </div>

  <!-- ===================== LEMBAR: FORM TARGET ===================== -->
  <div x-show="tSheet" class="fade fixed inset-0 z-50 flex items-end justify-center bg-black/50" @click.self="tSheet=false" role="dialog" aria-modal="true" aria-label="Form target">
    <div class="sheet w-full max-w-md bg-canvas dark:bg-night rounded-t-4xl max-h-[92dvh] flex flex-col">
      <div class="pt-3 pb-4 px-5"><div class="w-10 h-1.5 rounded-full bg-black/10 dark:bg-white/20 mx-auto"></div></div>
      <div class="px-5 overflow-y-auto no-scrollbar flex-1 space-y-4">
        <h2 class="text-lg font-extrabold" x-text="tf.id?'Edit target':'Target baru'"></h2>
        <div x-show="!tf.id">
          <p class="label mb-2">Mulai cepat</p>
          <div class="flex gap-2 overflow-x-auto no-scrollbar -mx-5 px-5 pb-1">
            <template x-for="p in presets" :key="p.name"><button type="button" @click="applyPreset(p)" class="chip shrink-0" x-text="p.emoji+' '+p.name"></button></template>
          </div>
        </div>
        <div class="grid grid-cols-[64px_1fr] gap-3">
          <div><label class="label" for="tf-emoji">Ikon</label><input id="tf-emoji" x-model="tf.emoji" @change="tf.emoji = grapheme(tf.emoji,'🎯')" class="field field-on-card mt-2 !px-0 text-center !text-xl"></div>
          <div><label class="label" for="tf-name">Nama target</label><input id="tf-name" x-model="tf.name" maxlength="40" placeholder="Contoh: Dana darurat" class="field field-on-card mt-2"></div>
        </div>
        <div>
          <label class="label" for="tf-target">Nominal target</label>
          <div class="relative mt-2">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-sm font-bold opacity-40">Rp</span>
            <input id="tf-target" x-model="tf.target" @input="tf.target=fmtInput($event.target.value)" inputmode="numeric" placeholder="0" class="field field-on-card !pl-11 num">
          </div>
        </div>
        <div><label class="label" for="tf-deadline">Tenggat (opsional)</label><input id="tf-deadline" type="date" x-model="tf.deadline" class="field field-on-card mt-2"></div>
        <p x-show="tError" class="text-xs font-semibold t-exp" role="alert" x-text="tError"></p>
      </div>
      <div class="flex gap-2 p-5 pb-[max(env(safe-area-inset-bottom),20px)]">
        <button x-show="tf.id" @click="delTarget()" class="btn btn-danger px-6" aria-label="Hapus target"><svg class="ic"><use href="#i-trash-2"/></svg></button>
        <button @click="saveTarget()" class="btn btn-primary flex-1" x-text="tf.id?'Simpan perubahan':'Buat target'"></button>
      </div>
    </div>
  </div>

  <!-- ===================== LEMBAR: SETOR / TARIK ===================== -->
  <div x-show="cSheet" class="fade fixed inset-0 z-[55] flex items-end justify-center bg-black/50" @click.self="cSheet=false" role="dialog" aria-modal="true" aria-label="Setor atau tarik dana">
    <div class="sheet w-full max-w-md bg-canvas dark:bg-night rounded-t-4xl max-h-[92dvh] flex flex-col">
      <div class="pt-3 pb-4 px-5"><div class="w-10 h-1.5 rounded-full bg-black/10 dark:bg-white/20 mx-auto"></div></div>
      <div class="px-5 overflow-y-auto no-scrollbar flex-1">
        <p class="text-center text-sm font-bold opacity-70 mb-4" x-text="cf.targetName"></p>
        <div class="seg mb-6">
          <button @click="cf.type='in'" :class="cf.type==='in'?'on':''">Setor</button>
          <button @click="cf.type='out'" :class="cf.type==='out'?'on':''">Tarik</button>
        </div>
        <div class="text-center mb-6">
          <label class="label" for="cf-amount">Nominal</label>
          <div class="flex items-center justify-center gap-2 mt-1">
            <span class="text-2xl font-bold opacity-40">Rp</span>
            <input id="cf-amount" x-model="cf.amount" @input="cf.amount=fmtInput($event.target.value)" @keydown.enter="saveContrib()" inputmode="numeric" autocomplete="off" placeholder="0" class="bg-transparent text-[40px] leading-[48px] font-extrabold text-center w-56 outline-none num">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3 mb-3">
          <div>
            <label class="label" for="cf-wallet" x-text="cf.type==='in'?'Diambil dari':'Dikembalikan ke'"></label>
            <select id="cf-wallet" x-model="cf.walletId" class="field field-on-card mt-2">
              <option value="">Di luar dompet</option>
              <template x-for="w in state.wallets" :key="w.id"><option :value="w.id" x-text="w.emoji+' '+w.name"></option></template>
            </select>
          </div>
          <div><label class="label" for="cf-date">Tanggal</label><input id="cf-date" type="date" x-model="cf.date" class="field field-on-card mt-2"></div>
        </div>
        <input x-model="cf.note" maxlength="120" placeholder="Catatan (opsional)" aria-label="Catatan" class="field field-on-card">
        <p class="text-[11px] opacity-60 mt-3">Pilih dompet agar saldonya ikut berubah. Pilih "Di luar dompet" bila dana disimpan di tempat terpisah.</p>
        <p x-show="cError" class="text-xs font-semibold t-exp mt-3" role="alert" x-text="cError"></p>
      </div>
      <div class="p-5 pb-[max(env(safe-area-inset-bottom),20px)]"><button @click="saveContrib()" class="btn btn-primary w-full" x-text="cf.type==='in'?'Simpan setoran':'Simpan penarikan'"></button></div>
    </div>
  </div>

  <!-- ===================== DIALOG KONFIRMASI ===================== -->
  <div x-show="cb.open" class="fade fixed inset-0 z-[60] grid place-items-center bg-black/55 px-6" role="alertdialog" aria-modal="true" aria-labelledby="cb-title" @click.self="answer(false)">
    <div class="sheet card w-full max-w-sm p-6 !rounded-4xl">
      <div class="w-12 h-12 rounded-2xl grid place-items-center mb-4" :class="cb.danger?'bg-red-100 text-red-600 dark:bg-red-500/20 dark:text-red-300':'bg-brand/10 text-brand-deep'"><svg class="ic !w-6 !h-6"><use :href="cb.danger?'#i-trash-2':'#i-info'"/></svg></div>
      <h2 id="cb-title" class="text-lg font-extrabold" x-text="cb.title"></h2>
      <p x-show="cb.text" class="text-sm opacity-70 mt-1.5" x-text="cb.text"></p>
      <div class="grid grid-cols-2 gap-3 mt-6">
        <button class="btn btn-soft" @click="answer(false)">Batal</button>
        <button class="btn" :class="cb.danger?'bg-red-600 text-white':'btn-primary'" @click="answer(true)" x-text="cb.ok"></button>
      </div>
    </div>
  </div>

  <!-- ===================== TOAST ===================== -->
  <div x-show="toast" x-transition.opacity class="fixed top-[max(env(safe-area-inset-top),16px)] inset-x-0 z-[70] flex justify-center pointer-events-none px-5" role="status" aria-live="polite">
    <div class="bg-ink dark:bg-white dark:text-ink text-white text-sm font-semibold rounded-2xl px-4 py-3 shadow-float max-w-sm text-center" x-text="toast"></div>
  </div>
</div>
</body>
</html>
